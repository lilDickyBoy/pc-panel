# Builds the Android APK and the Windows app in the cloud and attaches them to the release.
# Runs when a release is published (and can be started by hand from the Actions tab).
#
# The APK must be signed with the same key as before, otherwise it can't install over the old version.
# That key lives in the repository secret DEBUG_KEYSTORE_B64 (base64 of debug.keystore).
name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The DEBUG_KEYSTORE_B64 secret is missing - the APK would not install as an update."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      # the runner already has the Android SDK ($ANDROID_HOME); just make sure the licenses are accepted
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../PC-Panel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: PC-Panel.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows app
        shell: pwsh
        run: |
          dotnet publish PC/PcPanel/PcPanel.csproj -c Release -r win-x64 --self-contained false -o "out/PC Panel"
          Get-ChildItem "out/PC Panel" -Filter *.pdb -Recurse | Remove-Item -Force
          Compress-Archive -Path "out/PC Panel" -DestinationPath PC-Panel-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PC-Panel-Windows.zip

  release:
    needs: [android, windows]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            PC-Panel.apk
            PC-Panel-Windows.zip
